<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="UA → IE Car Scout logo">
  <!-- Background shield/roundrect -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0A0E1A"/>

  <!-- Arrow path UA → IE -->
  <path d="M8 28 L14 22 L14 25 L34 25 L34 22 L40 28 L34 34 L34 31 L14 31 L14 34 Z"
        fill="#2563EB" opacity="0.15"/>

  <!-- Car silhouette (simplified) -->
  <path d="M11 30 Q11 28 13 28 L17 26 Q19 23 24 23 Q29 23 31 26 L35 28 Q37 28 37 30 L37 32 Q37 33 36 33 L34 33 Q34 31 32 31 Q30 31 30 33 L18 33 Q18 31 16 31 Q14 31 14 33 L12 33 Q11 33 11 32 Z"
        fill="white"/>

  <!-- Wheels -->
  <circle cx="16" cy="33" r="2.5" fill="#1E293B" stroke="white" stroke-width="1"/>
  <circle cx="32" cy="33" r="2.5" fill="#1E293B" stroke="white" stroke-width="1"/>

  <!-- Window -->
  <path d="M19.5 28 Q20.5 25.5 24 25.5 Q27.5 25.5 28.5 28 Z"
        fill="#2563EB" opacity="0.8"/>

  <!-- UA flag stripe (bottom left corner accent) -->
  <rect x="2" y="38" width="22" height="8" rx="0" fill="#1D4ED8" opacity="0.6"
        style="clip-path: inset(0 0 0 0 round 0 0 0 12px)"/>
  <rect x="2" y="38" width="22" height="4" rx="0" fill="#3B82F6" opacity="0.5"/>
  <rect x="2" y="42" width="22" height="4" rx="0" fill="#FBBF24" opacity="0.5"/>

  <!-- IE clover dot (bottom right) -->
  <circle cx="38" cy="42" r="4" fill="#16A34A" opacity="0.7"/>
  <text x="38" y="45.5" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="700" fill="white">☘</text>
</svg>
